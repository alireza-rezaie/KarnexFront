<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const themeKey = 'karnex-theme'
          const legacyThemeKey = 'karban-theme'
          const saved = localStorage.getItem(themeKey) ?? localStorage.getItem(legacyThemeKey)
          if (!localStorage.getItem(themeKey) && (saved === 'light' || saved === 'dark')) {
            localStorage.setItem(themeKey, saved)
          }
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <title>کارنکس - Karnex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
